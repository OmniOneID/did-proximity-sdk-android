name: Build and Upload AAR to GitHub Releases
on:
  pull_request:
    branches:
      - main
    types: [closed]
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/QA-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/did-proximity-sdk-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Release AAR
        run: |
          bash ./gradlew :proximity-holder-fused:bundle :proximity-reader-fused:bundle --stacktrace
      - name: Set release title
        id: set_release_title
        run: |
          # 'release/QA-'
          release_tag=${GITHUB_HEAD_REF#release/QA-}
          echo "Release tag: $release_tag"
          echo "::set-output name=release_tag::$release_tag"
      - name: Get commit messages
        id: get_commit_messages
        run: |
          # main
          commits=$(git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --pretty=format:"* %s")
          echo "$commits" > commit_messages.txt
          echo "::set-output name=commits::$commits"
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          tag_name: ${{ steps.set_release_title.outputs.release_tag }}
          release_name: ${{ steps.set_release_title.outputs.release_tag }}
          body: |
            ## Changes:
            ${{ steps.get_commit_messages.outputs.commits }}
      - name: Upload proximity-holder AAR
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: source/did-proximity-sdk-android/proximity-holder-fused/build/outputs/aar/proximity-holder-fused.aar
          asset_name: proximity-holder-${{ steps.set_release_title.outputs.release_tag }}.aar
          asset_content_type: application/zip
      - name: Upload proximity-reader AAR
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: source/did-proximity-sdk-android/proximity-reader-fused/build/outputs/aar/proximity-reader-fused.aar
          asset_name: proximity-reader-${{ steps.set_release_title.outputs.release_tag }}.aar
          asset_content_type: application/zip
